<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Exercício 3 </title>
</head>
<body>

<center><h1 style="color: lightpink"> Pesquisa de Satisfação do Cliente 🎀 </h1></center>
<img src="https://i.pinimg.com/originals/b8/26/uf/b8261f0163fff2cc01c5cb1159b4767b.gif" width="200" height="200" />
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
    <br>

    <label>
        Empresa:
        <input name="form_empresa" type="text" placeholder="Digite sua empresa" required>
    </label>
    <br>
    <br>

    <label>
        Idade: <br>
        <input name="form_idade" value="1" type="radio" required>
        10-20 anos
    </label>

    <label>
        <input name="form_idade" value="2" type="radio" required>
        20-30 anos
    </label>

    <label>
        <input name="form_idade" value="3" type="radio" required>
        30-50 anos
    </label>

    <label>
        <input name="form_idade" value="4" type="radio" required>
        50-80 anos
    </label>
    <br>
    <br>

    <label>
        E-mail:
        <input name="form_email" type="email" placeholder="Digite seu E-mail" required>
    </label>
    <br>
    <br>

    <label>
        Telefone Comercial:
        <input name="form_telefone" type="tel" placeholder="(18) 3606-4725" required>
    </label>

    <label>
        Celular:
        <input name="form_celular" type="tel" placeholder="(18) 12345-6789" required>
    </label>
    <br>
    <br>

    <label>
        Como você avalia nossos serviços atualmente?: <br>
        <input name="form_avaliacao_atualmente" value="1" type="radio" required>
        REGULAR
    </label>

    <label>
        <input name="form_avaliacao_atualmente" value="2" type="radio" required>
        BOM
    </label>

    <label>
        <input name="form_avaliacao_atualmente" value="3" type="radio" required>
        EXCELENTE
    </label>
    <br>
    <br>

    <label>
        Como você avalia os serviços da área operacional?: <br>
        <input name="form_avaliacao_operacional" value="1" type="radio" required>
        REGULAR
    </label>

    <label>
        <input name="form_avaliacao_operacional" value="2" type="radio" required>
        BOM
    </label>

    <label>
        <input name="form_avaliacao_operacional" value="3" type="radio" required>
        EXCELENTE
    </label>
    <br>
    <br>

    <label>
        Qual o nível de satisfação com o atendimento administrativo quando você precisa?: <br>
        <input name="form_satisfacao" value="1" type="radio" required>
        POUCO SATISFATÓRIO
    </label>

    <label>
        <input name="form_satisfacao" value="2" type="radio" required>
        SATISFATÓRIO
    </label>

    <label>
        <input name="form_satisfacao" value="3" type="radio" required>
        MUITO SATISFATÓRIO
    </label>
    <br>
    <br>

    <label>
        Os profissionais lhe atendem de forma satisfatória?: <br>
        <input name="form_profissionais" value="1" type="radio" required>
        NÃO
    </label>

    <label>
        <input name="form_profissionais" value="2" type="radio" required>
        SIM
    </label>
    <br>
    <br>

    <label>
        Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços?: <br>
        <textarea name="form_sugestao" rows="05" cols="50" required> </textarea>
    </label>
    <br>
    <br>

    <button type="submit"> Enviar formulário </button>
    <button type="reset"> Limpar formulário </button>

</form>
</body>
</html>
