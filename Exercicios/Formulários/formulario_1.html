<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Exercício 1 </title>
</head>
<body>

<h1> Exercício 1: Envie um E-mail </h1>
<form action="" method="post">

    <label>
        Nome:
        <input name="form_name" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
    <br>

    <label>
        E-mail:
        <input name="form_email" type="email" placeholder="Digite seu E-mail" required>
    </label>
    <br>
    <br>

    <label>
        Assunto:
        <input name="form_assunto" type="text" placeholder="Digite o assunto da mensagem">
    </label>
    <br>
    <br>

    <label>
        Mensagem:<br>
        <textarea name="form_mensagem" rows="10" cols="30"> </textarea>
    </label>
    <br>
    <br>

    <button type="submit"> Enviar </button>
    <button type="reset"> Limpar </button>

</form>

</body>
</html>
